name: Release

# Pushing a version tag (v1.2.1, ...) runs the tests, builds the release APK
# and publishes it as a GitHub Release, with that version's CHANGELOG entry
# as the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Sign with the release key when the repository has it as secrets;
      # otherwise the build falls back to a debug key (see app/build.gradle.kts).
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - run: ./gradlew :core:test :ocr:test :app:testDebugUnitTest :app:assembleRelease

      - name: Name the APK and pull the notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "ddr-tracker-$version.apk"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: DDR Performance Tracker ${{ github.ref_name }}
          body_path: notes.md
          files: ddr-tracker-*.apk
