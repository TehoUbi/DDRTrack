name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-server:
    name: Core + server tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      DDR_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Server tests start a real PostgreSQL through embedded-postgres.
      - run: ./gradlew :core:test :server:test :server:buildFatJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-server-test-reports
          path: |
            core/build/reports/tests
            server/build/reports/tests
      # The image job packages this jar rather than rebuilding it inside
      # Docker, where nothing is cached and every dependency is downloaded
      # again (a failed download from Maven Central broke that job).
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/build/libs/ddr-leaderboard.jar
          retention-days: 7

  app:
    name: App unit + screenshot tests, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # :ocr downloads the PP-OCR models and reads the five real photos in samples/.
      - run: ./gradlew :ocr:test :app:testDebugUnitTest :app:verifyRoborazziDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ddr-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    needs: core-and-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: server/build/libs
      - run: docker build -f server/Dockerfile --target prebuilt -t ddr-leaderboard:ci .
      # The jar is in the image and readable by the server's (non-root) user.
      - name: Check the image
        run: docker run --rm --entrypoint sh ddr-leaderboard:ci -c 'test -r /app/ddr-leaderboard.jar && echo "jar present"'
