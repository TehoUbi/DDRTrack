name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-server:
    name: Core + server tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      DDR_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Server tests start a real PostgreSQL through embedded-postgres.
      - run: ./gradlew :core:test :server:test :server:buildFatJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-server-test-reports
          path: |
            core/build/reports/tests
            server/build/reports/tests

  app:
    name: App unit + screenshot tests, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ddr-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t ddr-leaderboard:ci .
